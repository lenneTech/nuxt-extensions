name: Build

on:
  push:
    branches:
      - '*/*'
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Release-critical guards that used to run on a maintainer's laptop only.
      # `version:check` protects the invariant whose failure mode froze the published
      # `meta.version` at 1.5.2 for three minor releases; `check:manifest` protects the
      # `files`/`exports` targets. Neither was enforced anywhere before.
      - name: Version sync check
        run: pnpm run version:check

      - name: Prepare
        run: pnpm dev:prepare

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package manifest check
        run: pnpm run check:manifest

      # Non-blocking: an advisory published between commits should surface in CI, but
      # must not fail a build for a transitive dev-only finding the diff never touched.
      #
      # This is deliberately NOT the same gate as `pnpm check`. That wrapper
      # (scripts/check.mjs) treats audit as fatal and blocks on a non-zero exit; the job
      # here is advisory, and publish.yml runs no audit at all. So the blocking audit gate
      # is local-only, and this workflow runs the check chain's steps individually rather
      # than invoking the wrapper.
      #
      # Keeping it that way is a choice, not an oversight: making CI block on a bare
      # `pnpm audit` means a newly published dev-only advisory can red an unrelated hotfix
      # pipeline with no change to this repo. The trade is that a green CI does not prove
      # a green `pnpm check` — run it before pushing.
      - name: Audit
        run: pnpm audit
        continue-on-error: true

      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./dist
