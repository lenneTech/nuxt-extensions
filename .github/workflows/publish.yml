name: Publish

on:
  release:
    types:
      - released

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Gates the PUBLISH itself. `prepack` rewrites src/module.ts from package.json,
      # so a broken sync script would ship a wrong `meta.version` while exiting 0 —
      # exactly how 1.5.2 was published three times over.
      - name: Version sync check
        run: pnpm run version:check

      - name: Prepare
        run: pnpm dev:prepare

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package manifest check
        run: pnpm run check:manifest

      - uses: JS-DevTools/npm-publish@v3
        with:
          access: public
          token: ${{ secrets.NPM_TOKEN }}
