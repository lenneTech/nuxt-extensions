# pnpm settings (single source of truth).
# pnpm 11 no longer reads the "pnpm" field in package.json; .npmrc is auth/registry only.

shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true

# Build-script packages, each classified true (build) / false (skip). pnpm 11 requires this.
allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
  # Transitive of the @nuxt/ui devDependency. Its postinstall only picks the Vue 2 vs Vue 3
  # re-export shim, and nothing in this repo imports vue-demi at runtime or in a test — the
  # contract test mounts reka components (which do not use it) and reads @nuxt/ui sources as
  # files. Skipped rather than trusted: a build script that buys us nothing should not run.
  vue-demi: false

# ----------------------------------------------------------------------------------
# Accepted advisories: exactly two, in `auditConfig` below.
#
# Suppression is the last resort, because it makes the audit green while the
# vulnerability is still present. Every entry has to clear this bar: name the advisory,
# trace the resolution path, say why it cannot be fixed, say why the residual risk is
# acceptable, give the condition for deleting the entry, and date the verification. One
# GHSA id per entry, never a range or a whole package, so anything new still turns the
# audit red. test/audit-report.test.ts pins the number of entries, so adding one is a
# deliberate edit there too.
#
# Two traps, both paid for elsewhere in the stack:
#
# 1. `ignoreGhsas` is keyed on the GHSA id ALONE — no package, version or path filter.
#    An entry hides that advisory EVERYWHERE in the graph, permanently. Since lt CLI
#    1.42.0 `auditConfig` is also hoisted as a UNION into generated projects, so an
#    entry here can silence an advisory well beyond this repo.
#
# 2. A suppression ages invisibly. It vanishes from `pnpm audit --json` completely, so
#    nothing reminds you to re-check it. In nest-server one sat five weeks obsolete
#    because the backport its justification called non-existent shipped a day after the
#    assessment. Here `pnpm run check:suppressions` (part of `check`, and of build.yml)
#    re-checks every entry against the GitHub Advisory Database and fails once its
#    advisory gets an installable fix or is withdrawn.
#
# What the report does with one: `scripts/check.mjs` counts findings that are counted in
# `metadata.vulnerabilities` but missing from `advisories`, and annotates the summary
# `(N <severity> not listed)`. It dims those numbers ONLY when an entry exists here —
# without one, an unlisted finding is merely below pnpm's default `--audit-level` of
# `low` (which excludes `info`), and nobody has assessed it. See `dimmableSeverities`
# in scripts/lib/audit-report.mjs; test/audit-report.test.ts pins the distinction.
# ----------------------------------------------------------------------------------

auditConfig:
  ignoreGhsas:
    # GHSA-86w9-cpqp-85rv (high): node-forge <=1.4.0 accepts extra nested DigestAlgorithm
    # elements when VERIFYING an RSA PKCS#1 v1.5 signature (signature forgery).
    # Path (dev tooling only): @nuxt/module-builder > @nuxt/cli@3 (its `^3.37.0` peer) > listhen
    #   > node-forge, and nuxt > @nuxt/nitro-server > nitropack > listhen > node-forge. Since
    #   nuxt 4.6.0 nuxt's own @nuxt/cli is 4.x, which no longer depends on listhen.
    # Why it cannot be fixed: no patched release exists. `pnpm audit` names ">=1.4.1", but
    #   registry.npmjs.org/node-forge/1.4.1 is a 404 and latest is 1.4.0; the GitHub advisory
    #   lists first_patched_version = null; listhen 1.10.1 (latest) still requires ^1.4.0. An
    #   override to 1.4.1 cannot resolve, and no parent bump drops node-forge.
    # Why the residual risk is acceptable: the published package never reaches it (its only
    #   dependency is @nuxt/kit; `pnpm audit --prod` reports 0 advisories). listhen uses
    #   node-forge only to GENERATE self-signed dev-server certificates (generateKeyPair,
    #   createCertificate, PEM conversion) and never verifies a signature, and neither package
    #   ends up in any build output.
    # Delete when: node-forge publishes a fixed version that listhen's range admits. Remove
    #   this entry, re-resolve, and `pnpm audit` must be clean without it.
    # Verified 2026-10-08 (node-forge latest still 1.4.0, listhen 1.10.1 still `^1.4.0`).
    - GHSA-86w9-cpqp-85rv
    # GHSA-vfj7-8cjw-p6xm (high, CVE-2026-93687): braces <=3.0.3 recurses through its AST
    # without a depth guard, so a deeply nested brace pattern exhausts the call stack and
    # terminates the process (denial of service).
    # Path (dev tooling only): nuxt > @nuxt/nitro-server > nitropack > globby (> fast-glob)
    #   > micromatch@4.0.8 > braces@3.0.3.
    # Why it cannot be fixed: no patched release exists. 3.0.3 is the newest version on the
    #   registry, the GitHub advisory lists first_patched_version = null, the braces repository
    #   has had no commit since 2025-01, and micromatch 4.0.8 (latest) still requires ^3.0.3.
    #   There is nothing to override to.
    # Why the residual risk is acceptable: the published package never reaches it (its only
    #   dependency is @nuxt/kit; `pnpm why braces --prod` finds nothing). nitropack globs with
    #   patterns from the project's own build configuration at build time, never with input
    #   from a request, so there is nobody to send the nested pattern.
    # Delete when: braces publishes a fixed version that micromatch's range admits. Remove this
    #   entry, re-resolve, and `pnpm audit` must be clean without it.
    # Verified 2026-10-03. nest-server suppresses the same advisory for its own dev path.
    - GHSA-vfj7-8cjw-p6xm

# ----------------------------------------------------------------------------------
# Security overrides: force vulnerable transitive deps onto patched versions.
#
# WARNING — these do NOT reach consumers of the published package. `overrides:` is
# honoured only for the ROOT project of an install, so a downstream project gets ITS
# OWN overrides, not these. A green `pnpm audit` here says nothing about a consumer's
# tree; the load-bearing entries are mirrored in nuxt-base-starter and lt-monorepo.
#
# Every target is a FIXED version, never an unbounded range — an open range silently
# drags a dependency across majors. Re-check on every maintenance run and drop what
# upstream has since requested on its own.
# ----------------------------------------------------------------------------------
overrides:
  # brace-expansion DoS — six advisories: GHSA-3jxr-9vmj-r5cp (exponential-time expansion
  # of consecutive non-expanding {} groups), GHSA-mh99-v99m-4gvg (unbounded expansion
  # length -> OOM, patched in 5.0.8), GHSA-rgw5-rvv9-x895 (unbounded intermediate
  # arrays, bypassing the CVE-2026-14257 mitigation — patched in 5.0.9), and three published
  # 2026-09-29: GHSA-6j4f-fj2g-mc7p (HIGH, 2.1.5 / 5.0.10), GHSA-qhr7-859c-m2p7 (HIGH,
  # 2.1.6 / 5.0.11) and GHSA-q2hr-2g5m-vwhr (MODERATE, 2.1.7 / 5.0.12). One entry per affected
  # major, each a patch bump INSIDE that major — a wider range would force a dependency across
  # two majors. Both targets track the newest release in their major: an override key is a PIN,
  # not a floor, so a target left behind the newest patch turns into a downgrade lock.
  #
  # Verified 2026-10-03 against the GitHub advisory database:
  # - Both KEYS widened to the window of GHSA-q2hr-2g5m-vwhr, the furthest-reaching of the three
  #   new advisories: 2.x `<2.1.4` -> `<2.1.7`, 5.x `<5.0.9` -> `<5.0.12`. The old keys let a
  #   2.1.4-2.1.6 or 5.0.9-5.0.11 copy slip past; audit stayed clean only because both targets
  #   (2.1.7, 5.0.12 — published 2026-09-14) already were the fixed-in versions. Targets
  #   unchanged: still the newest release in each major. No 2.x copy is in this tree today
  #   (latent entry, mirrored); minimatch 10.2.6 requests ^5.0.8, which intersects the 5.x key.
  # - The 4.x line (4.0.0, 4.0.1) is also affected but has NO fix inside its major — the
  #   advisories name 5.0.12. No 4.x copy is in this tree; the key deliberately stays at
  #   `>=5.0.0` so it never drags a 4.x consumer across a major.
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'
  # The real lever for GHSA-mh99-v99m-4gvg: only brace-expansion 5.0.8 carries the fix, and
  # forcing it onto a minimatch@3 consumer throws "expand is not a function" (5.x exports a
  # namespace object, not a callable). minimatch 10.2.6 REQUESTS ^5.0.8, so lifting every
  # 5.x/9.x consumer onto it removes the vulnerable 2.x line from the tree legitimately.
  # Safe: 9 and 10 share the same non-callable CJS export shape.
  'minimatch@>=5.0.0 <10.2.6': '10.2.6'
  # tar — five advisories in one line (GHSA-23hp-3jrh-7fpw critical: decompression/parse DoS via
  # unlimited input; GHSA-8x88-c5mf-7j5w, GHSA-w8wr-v893-vjvp, GHSA-gvwx-54wh-qm9j,
  # GHSA-r292-9mhp-454m). The highest patch floor across them is 7.5.21.
  'tar@<7.5.21': '7.5.22'
  # shell-quote — two advisories in one line, both via nuxt > @nuxt/devtools > launch-editor
  # (requests ^1.8.4, which intersects the key, so the target is a PIN, not a floor):
  #   - GHSA-395f-4hp3-45gv (high, CWE-407) — quadratic-complexity DoS in parse(), patched 1.9.0
  #   - GHSA-pqg4-j6r4-53mv (critical) — quote() command injection via a line terminator in a
  #     token after a `{ comment }` token, affects >=1.8.4 <1.11.0, patched 1.11.0
  # The old target 1.10.0 sat inside the second window, so the pin itself had become the
  # vulnerable version. Raised 2026-10-08 to 1.11.0, the first patched release: published
  # 2026-09-29, so it has cleared the 7d `minimumReleaseAge` gate of the repos this block is
  # mirrored into. 1.12.0 (2026-10-02, parse syntax additions, no further advisory fix) clears
  # that gate on 2026-10-09 — raise the target to it then, or drop the entry once launch-editor
  # requests ^1.11.0 itself.
  # Verified 2026-10-08: launch-editor 2.14.2 now requests ^1.10.0 — still inside the key, so the
  # drop condition is not met. A fresh resolve without the overrides block picks 1.12.0, so the
  # 1.11.0 target is a known downgrade lock until that raise; it is not a vulnerability (1.11.0 is
  # the fixed-in version).
  'shell-quote@<1.11.0': '1.11.0'
  # svgo — the removeScripts plugin left executable content intact: some scripts
  # (GHSA-2p49-hgcm-8545, patched 4.0.2), links smuggled through namespace and control-character
  # bypasses (GHSA-w27v-7q3p-w38r, HIGH) and HTML inside <foreignObject> (GHSA-4vpr-x523-8j87),
  # both patched >=4.1.0. Arrives via cssnano > postcss-svgo, from @nuxt/module-builder > mkdist
  # and nuxt > @nuxt/vite-builder; module-builder 1.0.3 and mkdist 2.4.1 are the newest releases,
  # so no parent bump carries the fix. Both parents request ^4.0.x, which permits 4.1.0 — the old
  # 4.0.2 target was the pin that held the tree below the fix. Key and target raised together;
  # 4.1.0 is the newest release in the major.
  'svgo@>=4.0.0 <4.1.0': '4.1.0'
  # postcss — arbitrary .map file disclosure through an attacker-controlled sourceMappingURL:
  # GHSA-6g55-p6wh-862q (HIGH, patched 8.5.12), GHSA-r28c-9q8g-f849 (HIGH, path traversal in
  # previous-source-map auto-loading, patched 8.5.18) and GHSA-fxqj-rqcc-2cmp (MODERATE, the
  # incomplete fix of the first one when `from` is unset, patched 8.5.23). Arrives via nuxt >
  # @nuxt/vite-builder, @nuxt/module-builder > mkdist > cssnano and @nuxt/ui > tailwindcss.
  #
  # Verified 2026-09-27: KEY widened `<8.5.18` -> `<8.5.23` so it covers GHSA-fxqj-rqcc-2cmp
  # (`<=8.5.22`), which the old key missed. Target 8.5.26 -> 8.5.28 (newest in the major): an
  # in-range refresh resolved 8.5.28 for direct consumers while the old target still pinned the
  # peer requests of autoprefixer and postcss-calc (both intersect the key) to 8.5.26 — two
  # copies, and an unmet peer that `pnpm peers check` rejects. The same two-copy tell as the
  # previous raise (8.5.24 -> 8.5.26).
  #
  # Verified 2026-10-08: no new postcss advisory, key unchanged. Target deliberately HELD at 8.5.28
  # although 8.5.29 (2026-10-05, no advisory attached) is the newest 8.x: it is younger than the 7d
  # gate of the repos this block is mirrored into. That makes 8.5.28 a downgrade lock today, and it
  # has a visible consequence: nuxt 4.6.0's @nuxt/vite-builder requests `^8.5.28`, which does NOT
  # intersect the key, so a resolve WITHOUT a lockfile takes 8.5.29 for it while autoprefixer's
  # peer request (intersects the key) stays pinned to 8.5.28 — two copies and an unmet peer that
  # `pnpm peers check` rejects. The committed lockfile carries ONE 8.5.28 copy (fresh resolve with
  # postcss held at 8.5.28, then re-resolved against this block unchanged). Raise the target to the
  # newest 8.5.x once 8.5.29 has cleared 7d (2026-10-12), via a fresh resolve.
  'postcss@<8.5.23': '8.5.28'
  # nanoid 3.x — GHSA-2v37-7h3g-55p8 (HIGH, custom generators loop indefinitely when size is 0,
  # patched 3.3.18), GHSA-28wg-ghj8-5hjv (HIGH, non-secure generators loop with a negative size,
  # patched 3.3.16) and GHSA-xwg4-73v4-xw9w (HIGH, integer overflow, patched 3.3.12). Only the
  # 3.x line is in this tree (via postcss).
  #
  # Verified 2026-09-27: KEY widened `<3.3.17` -> `<3.3.18`. The id this entry used to cite,
  # GHSA-qmxm-cq3q-gh8v ("patched 3.3.17"), no longer resolves in the advisory database; the
  # same defect is GHSA-2v37-7h3g-55p8, patched only in 3.3.18 — so 3.3.17 slipped past the
  # old key. Target 3.3.18 -> 3.3.19 (newest 3.x): the tree carried both, the old target
  # pinning a second copy next to the 3.3.19 postcss requests on its own.
  #
  # Verified 2026-10-08: latent in this tree. postcss 8.5.28 requests ^3.3.18, which no longer
  # intersects the key, so the tree resolves nanoid 3.3.20 (2026-10-05, no advisory attached) on
  # its own — identical with and without the overrides block. Kept for the mirrored repos, where an
  # older postcss can still request into the window. Raise the target to 3.3.20 once it has
  # cleared 7d (2026-10-12), so that a mirror's pinned copy matches the free one.
  'nanoid@<3.3.18': '3.3.19'
  # esbuild — the dev server accepts requests from any origin on Windows, letting a malicious
  # page read arbitrary files through it (GHSA-g7r4-m6w7-qqqr, patched >=0.28.1). Entered this
  # tree with the @nuxt/ui devDependency, via @nuxt/fonts > fontless.
  #
  # Scoped to that one path rather than overriding esbuild globally: the advisory covers
  # >=0.27.3 <0.28.1 only, and an unscoped entry would also drag the unaffected 0.25.x copy
  # elsewhere in the tree across two minors for no security gain. `fontless` asks for ^0.27.0,
  # so this deliberately steps outside its declared range — safe here because 0.28.2 is already
  # resolved in this tree for other consumers, and because esbuild is dev-tooling that never
  # reaches the published package.
  #
  # Verified 2026-10-03: still load-bearing. A fresh resolve without the overrides block puts
  # esbuild 0.27.7 back via @nuxt/ui > @nuxt/fonts 0.14.0 (latest) > fontless 0.2.1 (still
  # `^0.27.0`), and `pnpm audit` reports GHSA-g7r4-m6w7-qqqr again. 0.28.2 is the newest 0.28.x.
  # Re-verified 2026-10-08 with the same probe and result. fontless 1.x no longer depends on
  # esbuild, but @nuxt/fonts 0.14.0 (still latest) requests fontless ^0.2.1 — drop this entry
  # once @nuxt/fonts moves to fontless 1.x.
  'fontless>esbuild': '0.28.2'
  # @tiptap/core — mergeAttributes() promotes an own `__proto__` key into inherited,
  # executable DOM attributes (GHSA-cp6q-959q-f8rh, MODERATE, patched >=3.30.4), and a
  # quadratic ReDoS in block and inline Markdown attribute parsing (GHSA-j95f-988m-3j2f, HIGH,
  # >=3.7.0 <3.30.5, patched 3.30.5 — published 2026-09-08, after this entry was written).
  # Entered this tree with the @nuxt/ui devDependency.
  #
  # Verified 2026-09-27: KEY widened `<3.30.4` -> `<3.30.5` on both entries so it covers
  # GHSA-j95f-988m-3j2f. The old key missed 3.30.4; audit stayed clean only because the old
  # target happened to be exactly 3.30.5.
  #
  # Worth knowing before anyone "simplifies" this away: @nuxt/ui (4.11.2 and 4.11.3 alike) asks
  # for ^3.31.3 as a dependency but ALSO declares every @tiptap/* package as a non-optional peer `^3`, and pnpm
  # resolves the peer. With a lockfile present it keeps whatever `^3` copy is already there
  # (the siblings sat on 3.30.2 through the @nuxt/ui bump), and every sibling @tiptap/*
  # package pins core to its own exact version — so core cannot move unless it is pushed.
  #
  # Target 3.31.3 = newest 3.x release when it was raised from 3.30.5 (Verified 2026-09-27).
  # It is a PIN, not a floor, and the old target had become a downgrade lock: @nuxt/ui 4.11.2
  # declares @tiptap/* as a non-optional peer `^3`, that range intersects the key, and pnpm
  # rewrote the peer onto the target — holding core at 3.30.5 although @nuxt/ui 4.11.2 itself
  # requests `^3.31.3` as a dependency. 3.31.3 is ~23d old, so it also clears the 7d
  # `minimumReleaseAge` gate of the repos this block is mirrored into (the reason 3.30.5 was
  # chosen on 2026-09-02, when 3.31.0 was one day old, no longer applies). The key keeps
  # encoding the advisory window; only the target moved. Path: @nuxt/ui (devDependency) >
  # @tiptap/* peers.
  #
  # Verified 2026-10-03: no new @tiptap/core or @tiptap/pm advisory, keys unchanged. 3.31.3 is
  # no longer the newest 3.x — 3.31.4 shipped 2026-09-30 (crash fixes, plus "prevent extra CSS
  # declarations from being rendered from editor content", with no advisory attached). Target
  # deliberately held at 3.31.3: 3.31.4 is younger than the 7d gate of the mirrored repos, the
  # same call as 2026-09-02. Through the @nuxt/ui 4.11.2 -> 4.11.3 bump the committed lockfile
  # kept the whole @tiptap family on one 3.31.3 copy. A resolve WITHOUT a lockfile does split it
  # (measured 2026-10-03): the siblings and @nuxt/ui's own `^3.31.3` dependencies take 3.31.4,
  # while the `^3` peer stays pinned to 3.31.3 — the downgrade-lock tell. Raise both targets to
  # the newest 3.x once it has cleared 7d (3.31.4 does on 2026-10-07), via the fresh-resolve
  # procedure, since `pnpm update` cannot move the auto-installed peers.
  #
  # Raised 2026-10-08: both targets 3.31.3 -> 3.31.4 (published 2026-09-30, 7.7d old, still the
  # newest 3.x), keys unchanged — no new @tiptap/core or @tiptap/pm advisory. Done via a fresh
  # resolve; the whole @tiptap family (37 packages) now sits on ONE 3.31.4 copy, and a fresh
  # resolve without the overrides block yields the identical 3.31.4 — no longer a downgrade lock.
  #
  # TWO entries, and the second is not optional: the @tiptap packages peer their siblings
  # at an EXACT version, so lifting core alone leaves `@tiptap/pm` behind as an unmet peer
  # (core@3.31.4 peers "@tiptap/pm": "3.31.4"). `pnpm audit` does not look at peer
  # conflicts, so the tree reports zero vulnerabilities while being internally inconsistent
  # — `pnpm peers check` is the one that says so. The other three dozen @tiptap packages
  # need no entry: pnpm rewrites their peer requirement onto the overridden version.
  # Raise both keys and both targets together, always.
  '@tiptap/core@<3.30.5': '3.31.4'
  '@tiptap/pm@<3.30.5': '3.31.4'
  # simple-git — four advisories, two of them critical: the VISUAL environment variable slips
  # past the unsafe-editor check (GHSA-v5rq-49vh-5v5c, reported against the @simple-git/argv-parser
  # <2.0.1 that 3.36.0 brings along), the trailer-command configuration slips past the
  # unsafe-operation guard (GHSA-x6jw-m9v5-85vh, >=3.15.0 <4.0.1), plus two high ones — git
  # configuration includes (GHSA-g4wm-2vf7-vfgr) and abbreviated long options
  # (GHSA-858h-whjf-mvg5), both <=3.36.0. Path (dev tooling only): nuxt > @nuxt/devtools 3.4.2,
  # which requests ^3.36.0.
  #
  # A MAJOR step, 3.36.0 -> 4.0.2, and it is the only fix: the critical window ends at <4.0.1 and
  # the 3.x line ends at 3.36.0, so no clean 3.x exists. The key encodes that window, so this
  # entry stops applying by itself once @nuxt/devtools requests a 4.x. 4.0.2 is the newest
  # release and pins @simple-git/argv-parser to the clean 2.0.1 exactly, so that critical needs no
  # entry of its own. @nuxt/devtools calls git.branch, git.revparse and git.status, all core API
  # in 4.x. The one break is that 4.x dropped the ESM default export @nuxt/devtools imports —
  # restored by `patches/simple-git@4.0.2.patch`, see `patchedDependencies` below.
  # Verified 2026-10-06.
  'simple-git@<4.0.1': '4.0.2'
  # source-map-js — event-loop DoS through indexed source-map section offsets
  # (GHSA-68fv-2mgg-jv7q, HIGH, >=1.0.0 <1.2.2). Arrives via @nuxt/kit > c12 > magicast and via
  # postcss everywhere vite is. A patch step inside 1.2.x; 1.2.2 is the newest release.
  # Verified 2026-10-06.
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'

# No explicit `minimumReleaseAge` is set in THIS repo, so pnpm 11's built-in 24h default applies in
# LOOSE mode: an immature pick is not blocked — pnpm appends it to the list below and carries on.
# After any install or update, `git diff pnpm-workspace.yaml` must show no entry nobody wrote.
#
# The list is mirrored — together with the overrides — into nuxt-base-starter / lt-monorepo, where
# a stricter age gate IS enforced and would otherwise block the freshest security fixes. Keep it in
# sync with THEIR threshold. As of 2026-10-03 every override target has aged past a 7d gate (the
# newest, brace-expansion@2.1.7 / 5.0.12, are ~19d), so the list is belt-and-braces rather than
# load-bearing — it only matters again when a maintenance run raises a target to a just-published
# patch. The postcss entry follows its override target (8.5.26 -> 8.5.28, ~30d old). The 2026-10-03
# run deliberately raised NO target to a release younger than 7d (shell-quote and @tiptap are held
# for that reason, see their entries), so this list gained nothing.
# 2026-10-06: source-map-js@1.2.2 (published 2026-09-30) is the only fix for its advisory and
# clears a 7d gate on 2026-10-07 — listed so the mirrors can take it now; drop it after that.
# simple-git@4.0.2 (2026-09-26) is already past 7d.
# 2026-10-08: source-map-js@1.2.2 dropped — its condition above is met (8d old). The @tiptap raise
# to 3.31.4 (7.7d) needs no entry; postcss / nanoid / shell-quote targets were held instead of
# being raised to <7d releases, so nothing was added.
minimumReleaseAgeExclude:
  - minimatch@10.2.6
  - postcss@8.5.28

# ----------------------------------------------------------------------------------
# Accepted peer drift.
#
# `pnpm peers check` runs in the `check` chain, right behind `pnpm audit`, because the
# two answer different questions and a tree can pass one while failing the other: audit
# asks "is anything here known-vulnerable", peers asks "is this tree internally
# consistent". Overriding a package onto a patched version is exactly the move that
# satisfies the first and breaks the second — lifting `@tiptap/core` left `@tiptap/pm`
# behind as an unmet peer while audit reported zero vulnerabilities.
#
# An entry here is therefore a claim that a specific mismatch is HARMLESS, not a way to
# quiet the gate. Add one only with the reason, and only when raising the installed
# version is not the right fix — which for almost every conflict it is.
# ----------------------------------------------------------------------------------
peerDependencyRules:
  allowedVersions:
    # `mkdist` declares `vue-sfc-transformer: ^0.1.1`, but `unbuild` — which ships mkdist
    # and pulls this in — installs 0.2.5. The installed copy is a major AHEAD of the
    # declared range, so this is not a stale lockfile that a bump would fix: forcing
    # ^0.1.x would break unbuild, and there is nothing else to force. Both arrive through
    # `nuxt-module-build`, it is build tooling that never reaches the published package,
    # the `build` step is green on it, and the fix belongs upstream in mkdist's range.
    # Drop this line once mkdist widens it.
    'mkdist>vue-sfc-transformer': '0.2.5'

# ----------------------------------------------------------------------------------
# Patched dependencies. Like `overrides`, these apply only to an install rooted HERE —
# `patches/` is not in the published `files`, and a consumer's tree is never patched.
#
# simple-git@4.0.2: re-adds the ESM default export 4.x dropped, so @nuxt/devtools'
# `import Git from 'simple-git'` resolves after the security override above. The reasoning,
# and why the pin to this exact version is deliberate, is in the patch file itself. Delete
# both the entry and the patch once @nuxt/devtools imports `{ simpleGit }`.
# ----------------------------------------------------------------------------------
patchedDependencies:
  simple-git@4.0.2: patches/simple-git@4.0.2.patch
