# pnpm settings (single source of truth).
# pnpm 11 no longer reads the "pnpm" field in package.json; .npmrc is auth/registry only.

shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true

# Build-script packages, each classified true (build) / false (skip). pnpm 11 requires this.
allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
  # Transitive of the @nuxt/ui devDependency. Its postinstall only picks the Vue 2 vs Vue 3
  # re-export shim, and nothing in this repo imports vue-demi at runtime or in a test — the
  # contract test mounts reka components (which do not use it) and reads @nuxt/ui sources as
  # files. Skipped rather than trusted: a build script that buys us nothing should not run.
  vue-demi: false

# ----------------------------------------------------------------------------------
# Security overrides: force vulnerable transitive deps onto patched versions.
#
# WARNING — these do NOT reach consumers of the published package. `overrides:` is
# honoured only for the ROOT project of an install, so a downstream project gets ITS
# OWN overrides, not these. A green `pnpm audit` here says nothing about a consumer's
# tree; the load-bearing entries are mirrored in nuxt-base-starter and lt-monorepo.
#
# Every target is a FIXED version, never an unbounded range — an open range silently
# drags a dependency across majors. Re-check on every maintenance run and drop what
# upstream has since requested on its own.
# ----------------------------------------------------------------------------------
overrides:
  # brace-expansion DoS — three advisories: GHSA-3jxr-9vmj-r5cp (exponential-time expansion
  # of consecutive non-expanding {} groups), GHSA-mh99-v99m-4gvg (unbounded expansion
  # length -> OOM, patched in 5.0.8) and GHSA-rgw5-rvv9-x895 (unbounded intermediate
  # arrays, bypassing the CVE-2026-14257 mitigation — patched only in 5.0.9, which is why
  # the 5.x floor moved up from 5.0.8). One entry per affected major, each a patch bump
  # INSIDE that major — a wider range would force a dependency across two majors.
  # The 2.x target tracks the newest release in that major (2.1.2 -> 2.1.4): an override key is a
  # PIN, not a floor, so a target left behind the newest patch turns into a downgrade lock.
  'brace-expansion@>=2.0.0 <2.1.2': '2.1.4'
  'brace-expansion@>=5.0.0 <5.0.9': '5.0.9'
  # The real lever for GHSA-mh99-v99m-4gvg: only brace-expansion 5.0.8 carries the fix, and
  # forcing it onto a minimatch@3 consumer throws "expand is not a function" (5.x exports a
  # namespace object, not a callable). minimatch 10.2.6 REQUESTS ^5.0.8, so lifting every
  # 5.x/9.x consumer onto it removes the vulnerable 2.x line from the tree legitimately.
  # Safe: 9 and 10 share the same non-callable CJS export shape.
  'minimatch@>=5.0.0 <10.2.6': '10.2.6'
  # tar — five advisories in one line (GHSA-23hp-3jrh-7fpw critical: decompression/parse DoS via
  # unlimited input; GHSA-8x88-c5mf-7j5w, GHSA-w8wr-v893-vjvp, GHSA-gvwx-54wh-qm9j,
  # GHSA-r292-9mhp-454m). The highest patch floor across them is 7.5.21.
  'tar@<7.5.21': '7.5.22'
  # shell-quote quadratic-complexity DoS in parse() (GHSA-395f-4hp3-45gv, HIGH / CWE-407,
  # patched >=1.9.0 — 1.8.5 never existed on the registry: versions jump 1.8.4 -> 1.9.0 -> 1.10.0,
  # so `<1.9.0` is the accurate lower bound and behaves identically to the vulnerable set `<=1.8.4`).
  'shell-quote@<1.9.0': '1.10.0'
  # svgo — the removeScripts plugin left some executable scripts intact (GHSA-2p49-hgcm-8545).
  'svgo@>=4.0.0 <4.0.2': '4.0.2'
  # postcss path traversal in previous-source-map auto-loading via sourceMappingURL, leaking
  # arbitrary .map files (GHSA-r28c-9q8g-f849, patched >=8.5.18). Target raised 8.5.24 -> 8.5.26
  # (newest in the major): part of the tree already requested 8.5.26 on its own, so the older
  # target was pinning a second, redundant copy of postcss alongside it.
  'postcss@<8.5.18': '8.5.26'
  # nanoid — custom generators loop indefinitely when size is 0 (GHSA-qmxm-cq3q-gh8v, HIGH,
  # patched >=3.3.17). Only the 3.x line is in this tree (via postcss); 3.3.18 is the current
  # `legacy` dist-tag, so this stays inside the major the consumers ask for.
  'nanoid@<3.3.17': '3.3.18'
  # esbuild — the dev server accepts requests from any origin on Windows, letting a malicious
  # page read arbitrary files through it (GHSA-g7r4-m6w7-qqqr, patched >=0.28.1). Entered this
  # tree with the @nuxt/ui devDependency, via @nuxt/fonts > fontless.
  #
  # Scoped to that one path rather than overriding esbuild globally: the advisory covers
  # >=0.27.3 <0.28.1 only, and an unscoped entry would also drag the unaffected 0.25.x copy
  # elsewhere in the tree across two minors for no security gain. `fontless` asks for ^0.27.0,
  # so this deliberately steps outside its declared range — safe here because 0.28.2 is already
  # resolved in this tree for other consumers, and because esbuild is dev-tooling that never
  # reaches the published package.
  'fontless>esbuild': '0.28.2'

# No `minimumReleaseAge` gate is set in THIS repo, so the exclude list below is inert here. It is
# mirrored — together with the overrides — into nuxt-base-starter / lt-monorepo, where an age gate
# IS enforced and would otherwise block the freshest security fixes. Keep this list in sync with
# THEIR threshold. As of 2026-08-23 every override target has aged well past a 7d gate (the newest,
# postcss@8.5.26, is ~17d), so the list is currently belt-and-braces rather than load-bearing — it
# only matters again when a future maintenance run raises a target to a just-published patch.
minimumReleaseAgeExclude:
  - minimatch@10.2.6
  - postcss@8.5.26
